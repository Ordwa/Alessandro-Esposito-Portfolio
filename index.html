<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alessandro Esposito | IT Architecture Consultant</title>
    <meta
      name="description"
      content="Portfolio professionale di Alessandro Esposito, IT Architecture Consultant: competenze, case study, percorso, certificazioni e contatti in un unico hub digitale."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Torna all'inizio">
        <img class="brand-photo" src="assets/Alessandro Esposito.jpeg" alt="" />
        <span data-content="person.name">Alessandro Esposito</span>
      </a>
      <nav class="nav" aria-label="Navigazione principale" data-render="navigation"></nav>
      <button class="nav-toggle" type="button" aria-label="Apri menu" aria-expanded="false">
        <span></span>
        <span></span>
      </button>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-media" role="img" aria-label="Postazione di consulenza IT con dashboard architetturali e workflow digitali"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <p class="eyebrow" data-content="hero.eyebrow">IT Architecture Consultant</p>
          <h1 id="hero-title" data-content="hero.title">Alessandro Esposito</h1>
          <p class="hero-copy" data-content="hero.copy"></p>
          <div class="hero-actions" data-render="heroActions"></div>
        </div>
        <aside class="hero-profile" aria-label="Profilo sintetico">
          <img src="assets/Alessandro Esposito.jpeg" alt="Alessandro Esposito" />
          <div>
            <strong data-content="person.name">Alessandro Esposito</strong>
            <span data-content="person.role">IT Architecture Consultant</span>
          </div>
        </aside>
      </section>

      <section class="snapshot" aria-label="Sintesi professionale" data-render="snapshot"></section>

      <section id="profilo" class="section two-column">
        <div>
          <p class="eyebrow" data-content="profile.eyebrow">Profilo</p>
          <h2 data-content="profile.title"></h2>
        </div>
        <div class="rich-text" data-render="profileParagraphs"></div>
      </section>

      <section id="competenze" class="section">
        <div class="section-heading">
          <p class="eyebrow" data-content="capabilities.eyebrow">Competenze</p>
          <h2 data-content="capabilities.title"></h2>
        </div>
        <div class="capability-grid" data-render="capabilities"></div>
      </section>

      <section id="percorso" class="section timeline-section">
        <div class="section-heading">
          <p class="eyebrow" data-content="journey.eyebrow">Percorso</p>
          <h2 data-content="journey.title"></h2>
        </div>
        <ol class="vertical-timeline" data-render="journey"></ol>
      </section>

      <section id="certificati" class="section certificates-section">
        <div class="section-heading">
          <p class="eyebrow" data-content="certificates.eyebrow">Certificati</p>
          <h2 data-content="certificates.title"></h2>
          <p class="section-intro" data-content="certificates.intro"></p>
        </div>
        <div class="certificate-grid" data-render="certificates"></div>
      </section>

      <section id="contatti" class="contact">
        <div>
          <p class="eyebrow" data-content="contact.eyebrow">Contatti</p>
          <h2 data-content="contact.title"></h2>
        </div>
        <div class="contact-actions" data-render="contactActions"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span data-content="footer.copyright">© 2026 Alessandro Esposito</span>
      <a href="#top" data-content="footer.backToTop">Torna su</a>
    </footer>

    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
